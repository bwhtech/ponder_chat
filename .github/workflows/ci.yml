# Checks every pull request and every push to main: the types, the build, and the
# end-to-end tests (e2e/README.md) on a real Postgres with a fake OpenRouter.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels its older run. On main, a run in progress is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Blobless, not shallow: the whole history, with each file's content fetched when it is read.
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup

      - name: Check the web app's types
        run: npm run typecheck

      - name: Check the server's types
        run: npm run typecheck:server

      - name: Check the tests' types
        run: npm run typecheck:e2e

      # The tests that need Postgres skip here, without TEST_DATABASE_URL; the e2e job runs them.
      - name: Run the server's unit tests
        run: npm run test

      - name: Check which pages web_fetch reads without asking
        run: npx tsx server/trusted-pages.check.ts

      - name: Check the connector catalog (search, signatures, input checks)
        run: npx tsx server/connector-catalog.check.ts

      - name: Check that web_fetch tidies a page in linear time
        run: npx tsx server/fetch-page.check.ts

      - name: Check that a PDF's text is read off the server's thread
        run: npx tsx server/pdf-text.check.ts

      - name: Check that no span carries content, and a reply is one trace
        run: npx tsx server/tracing.check.ts

      - name: Check how a long chat is summarized
        run: npx tsx server/compaction.check.ts

      - name: Check that a reply saves the same, and fast, with its tool input joined
        run: npx tsx server/reply-save.check.ts

      - name: Check a compaction run, its retries and a stopped run
        run: npx tsx server/compaction-flow.check.ts

      - name: Check the reply loop's retries, stream and approvals
        run: npx tsx server/workflow/loop.check.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_DATABASE_URL: postgres://ponder:ponder@127.0.0.1:5432/ponder_e2e
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      # In the background, so the image downloads while the dependencies install.
      # Its data is in memory (tmpfs): nothing needs to outlive the job.
      - name: Start Postgres
        run: |
          (docker run -d --name pg --tmpfs /var/lib/postgresql -p 5432:5432 \
            -e POSTGRES_USER=ponder -e POSTGRES_PASSWORD=ponder -e POSTGRES_DB=postgres \
            pgvector/pgvector:pg18 > /tmp/pg.log 2>&1 &)

      - uses: ./.github/actions/setup

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 120); do
            docker exec pg pg_isready -U ponder -h 127.0.0.1 > /dev/null 2>&1 && exit 0
            sleep 0.5
          done
          cat /tmp/pg.log; docker logs pg; exit 1

      # On the service's own "postgres" database, which the e2e tests do not use (vitest.config.ts).
      - name: Run the server's unit tests, with Postgres
        run: npm run test
        env:
          TEST_DATABASE_URL: postgres://ponder:ponder@127.0.0.1:5432/postgres

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Only the headless shell, which headless tests use. The runner image already has the
      # system libraries that Chromium needs (it ships Google Chrome), so there is no apt step.
      # Skips the download when the cache has it.
      - name: Install Chromium
        run: npx playwright install --only-shell chromium

      - name: Build Ponder
        run: npm run build

      - name: Run the end-to-end tests
        run: npx playwright test

      # The connector checks write to the database that the tests made, which has Ponder's tables.
      - name: Run the connector checks
        run: npx tsx server/mcp.check.ts
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          BETTER_AUTH_SECRET: ci-secret-for-the-checks-0123456789abcdef

      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
