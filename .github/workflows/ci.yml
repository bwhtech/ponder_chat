# Checks every pull request and every push to main: the types, the build, and the
# end-to-end tests (e2e/README.md) on a real Postgres with a fake OpenRouter.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels its older run. On main, a run in progress is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the web app's types
        run: npm run typecheck

      - name: Check the server's types
        run: npm run typecheck:server

      - name: Check the tests' types
        run: npm run typecheck:e2e

      - name: Check which pages web_fetch reads without asking
        run: npx tsx server/trusted-pages.check.ts

      - name: Check that web_fetch tidies a page in linear time
        run: npx tsx server/fetch-page.check.ts

      - name: Check that a PDF's text is read off the server's thread
        run: npx tsx server/pdf-text.check.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ponder
          POSTGRES_PASSWORD: ponder
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ponder"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://ponder:ponder@127.0.0.1:5432/ponder_e2e
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Skips the download when the cache has it, and installs the system libraries either way.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Ponder
        run: npm run build

      - name: Run the end-to-end tests
        run: npx playwright test

      # The connector checks write to the database that the tests made, which has Ponder's tables.
      - name: Run the connector checks
        run: npx tsx server/mcp.check.ts
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          BETTER_AUTH_SECRET: ci-secret-for-the-checks-0123456789abcdef

      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
