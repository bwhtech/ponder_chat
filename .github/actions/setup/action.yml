# Node.js and the installed dependencies, for every job (.github/workflows/ci.yml).
# node_modules itself is cached, by the lockfile: a hit skips `npm ci`. Runs on main
# save the cache, and every pull request can read main's caches.
name: Set up
description: Node.js 24 and node_modules
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Restore node_modules
      id: modules
      uses: actions/cache@v6
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package.json', 'package-lock.json') }}

    - name: Install dependencies
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit --no-fund
