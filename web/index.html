<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!-- cover: the page draws under the notch and home bar, and env(safe-area-inset-*) has values to pad back with.
		     resizes-content: on Android the keyboard shrinks the page (100dvh), so the message field stays above it. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
		<!-- The browser bar and status bar match the header (--surface-base). Kept in step with data-theme below. -->
		<meta name="theme-color" content="#ffffff" />
		<title>Ponder Chat</title>
		<meta name="description" content="A private chat on OpenRouter's models for a small group. Answers cite their sources." />
		<!-- The same icon as ICON in attention.ts, which draws a count on it while the tab is hidden. -->
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!-- Installed to the home screen, the app opens on its own, without the browser bars. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Ponder" />
		<!-- See-through status bar: the header, padded by env(safe-area-inset-top), shows under it. iOS reads
		     this only from the HTML, not from a tag added by script (the same set-up as Gameplan). -->
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<!-- Paint the saved light/dark choice before the app loads (frappe-ui's useColorScheme keeps it under "theme"). -->
		<script>
			(() => {
				const saved = localStorage.getItem("theme");
				const dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
				const root = document.documentElement;
				root.setAttribute("data-theme", dark ? "dark" : "light");
				// frappe-ui's color scheme switch sets data-theme; follow it with the status bar colour.
				const themeColor = document.querySelector('meta[name="theme-color"]');
				// The page behind the shell is painted here too, before the CSS loads, so the area under the
				// status bar is never white.
				const sync = () => {
					const color = root.dataset.theme === "dark" ? "#171717" : "#ffffff";
					themeColor.setAttribute("content", color);
					root.style.backgroundColor = color;
				};
				sync();
				new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
			})();
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
