<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Seva Chat</title>
		<!-- The same icon as ICON in attention.ts, which draws a count on it while the tab is hidden. -->
		<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2316794c%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2245%22%20font-family%3D%22system-ui%2Csans-serif%22%20font-size%3D%2238%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3ES%3C%2Ftext%3E%3C%2Fsvg%3E" />
		<!-- Paint the saved light/dark choice before the app loads (frappe-ui's useColorScheme keeps it under "theme"). -->
		<script>
			(() => {
				const saved = localStorage.getItem("theme");
				const dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
			})();
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
